<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Profile Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="app" aria-labelledby="page-title">
      <div class="intro">
        <p class="eyebrow">GitHub API</p>
        <h1 id="page-title">GitHub Profile Card</h1>
        <button class="theme-toggle" id="theme-toggle" type="button">Темная тема</button>
      </div>

      <form class="search" id="search-form">
        <label class="visually-hidden" for="username">GitHub username</label>
        <input
          id="username"
          type="text"
          placeholder="Введите username"
          autocomplete="off"
          required
        >
        <label class="visually-hidden" for="compare-username">Second GitHub username</label>
        <input
          id="compare-username"
          type="text"
          placeholder="Сравнить с username"
          autocomplete="off"
        >
        <button id="search-button" type="submit">Найти</button>
        <button id="random-button" type="button">Случайный</button>
      </form>

      <div class="search-history hidden" id="search-history" aria-label="Последние поиски"></div>

      <div class="controls">
        <label for="repo-sort">Сортировка репозиториев</label>
        <select id="repo-sort">
          <option value="updated">По обновлению</option>
          <option value="stars">По звездам</option>
          <option value="created">По созданию</option>
        </select>
      </div>

      <div class="loading hidden" id="loading" role="status" aria-live="polite">
        <span class="spinner" aria-hidden="true"></span>
        <span>Загружаю...</span>
      </div>
      <p class="error hidden" id="error" role="alert"></p>

      <section class="profiles hidden" id="profiles" aria-label="Профили">
        <article class="profile hidden" id="profile"></article>
        <article class="profile hidden" id="compare-profile"></article>
      </section>

      <section class="languages hidden" id="languages-section" aria-labelledby="languages-title">
        <h2 id="languages-title">Топ языков</h2>
        <div class="language-list" id="languages"></div>
      </section>

      <section class="repos hidden" id="repos-section" aria-labelledby="repos-title">
        <h2 id="repos-title">Последние репозитории</h2>
        <div class="repo-list" id="repos"></div>
      </section>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
